# One-click deploy of the CallPilot server (in /server) on Render: New > Blueprint > pick this repo.
# Render asks for each "sync: false" value when you create it.
services:
  - type: web
    name: callpilot
    runtime: docker
    rootDir: server
    dockerfilePath: ./Dockerfile
    dockerContext: .
    branch: feature/calling-ai-voice
    autoDeploy: true
    buildFilter:
      paths: ['server/**']
    # free: sleeps after ~15 idle minutes and wakes in 30-60 s when the app opens.
    # The phone app keeps its own copy of every call, so nothing is lost when it sleeps.
    # For always-on with no wake-up wait, change to "starter" (~$7/month) and
    # optionally add a disk (name: callpilot-data, mountPath: /data, sizeGB: 1).
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: APP_PASSCODE
        sync: false
      - key: OWNER_NAME
        sync: false
      - key: ASSISTANT_NAME
        value: Pilot
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_API_KEY_SID
        sync: false
      - key: TWILIO_API_KEY_SECRET
        sync: false
      - key: TWILIO_TWIML_APP_SID
        sync: false
      - key: TWILIO_PHONE_NUMBER
        sync: false
      - key: DEEPGRAM_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: AGENT_TTS
        value: flux
